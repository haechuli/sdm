<div class="sa01-container">
  <app-page-title
      title="딜러 조회(SA01)"
      subtitle="딜러의 파트너의 정보를  확인할 수 있습니다"
      icon="fas fa-tachometer-alt"
      size="small">
  </app-page-title>
  <!-- Search Form -->
  <div class="search-section">

    <div class="form-grid">

        <!-- Branch -->

          <label class="item" for="branch">Branch</label>
          <app-combobox
            class="item"
            [(ngModel)]="searchCriteria.brNo"
            [options]="branchOptions"
            placeholder="Select Branch">
          </app-combobox>


        <!-- ShowRoom Name -->

          <label class="item" for="showroom">ShowRoom Name</label>
          <app-input
            class="item"
            [width]="'300px'"
            [(ngModel)]="searchCriteria.name"
            placeholder="Enter showroom name">
          </app-input>

        <!-- Search Button -->

          <app-button
            class="item"
            label="Search"
            color="primary"
            [width]="'100px'"
            (clicked)="onSearch()">
          </app-button>


        <label class="item" for="status">Status</label>
          <app-combobox
            class="item"
            [(ngModel)]="searchCriteria.status"
            [options]="statusOptions"
            placeholder="Select Status">
          </app-combobox>

         <label class="item" for="contactName">Contact Name</label>
          <app-input
            class="item"
            [width]="'300px'"
            [(ngModel)]="searchCriteria.fullName"
            placeholder="Enter contact name">
          </app-input>
         <div class="item"></div>

         <!-- Partner -->
         <label class="item" for="partner">Partner</label>
          <app-combobox
            class="item"
            [(ngModel)]="searchCriteria.dlrKndCd"
            [options]="partnerKindOptions"
            placeholder="Select Partner Kind">
          </app-combobox>

           <!-- Bank Account Name -->
          <label class="item" for="bankAccountName">Bank Account Name</label>
          <app-input
            class="item"
            [width]="'300px'"
            [(ngModel)]="searchCriteria.bankAccountName"
            placeholder="Enter bank account name">
          </app-input>
          <div class="item"></div>

         <label class="item" for="npwp">NPWP</label>
          <app-input
            class="item"
            [(ngModel)]="searchCriteria.npwp"
            placeholder="Enter NPWP">
          </app-input>

          <label class="item" for="address">Address</label>
          <app-input
            [width]="'300px'"
            [(ngModel)]="searchCriteria.address"
            placeholder="Enter address">
          </app-input>
          <div class="item"></div>
    </div>


  <div class="row-gap"></div>


  <!-- Partner List Section -->
  <div class="grid-section">
    <div class="section-header">
      <div class="title-container">
        <div class="title-arrow"></div>
        <h3 class="section-title">Partner List</h3>
      </div>
      <app-button
        label="Dealer Modify"
        color="secondary"
        [width]="'150px'"
        [disabled]="!selectedDealer"
        (clicked)="onDealerModify()">
      </app-button>
    </div>

    <!-- Partner List Grid -->
    <div class="grid-container">
      <app-grid
        [height]="'300px'"
        [data]="dealerList"
        [columns]="dealerListColumns"
        [loading]="loading"
        (rowClick)="onDealerSelect($event)"
        class="dealer-grid">
      </app-grid>
    </div>

    <div class="row-gap"></div>
    <!-- Partner Details Grid -->
    <div class="grid-container">
      <app-grid
        [height]="'200px'"
        [data]="dealerDetails"
        [columns]="dealerDetailColumns"
        (rowDoubleClick)="onDealerDetailDoubleClick($event)"
        class="dealer-detail-grid">
      </app-grid>
    </div>
  </div>

  <!-- Loading overlay -->
  <div class="loading-overlay" *ngIf="loading">
    <app-loading></app-loading>
  </div>
</div>
