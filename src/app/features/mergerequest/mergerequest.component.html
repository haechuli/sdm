
    <app-grid
        [columns]="gridColumns"
        [data]="gridData1"
        [selectable]="true"
        [enablePagination]="true"
        [pageSize]="12"
        [virtualScroll]="true"
        width="900px"
        height="400px"
        (rowClick)="onGridRowClick($event)"
        (rowDoubleClick)="onGridRowDoubleClick($event)"
        (selectedRowsChange)="onGridSelectionChange($event)">
    </app-grid>
