<app-grid
      [columns]="columns"
      [data]="rows"
      [enablePagination]="true"

      [virtualScroll]="true"
      [width]="'100%'"
      [height]="'600px'"
      (selectedRowsChange)="onSelected($event)"
    />

    <ng-template #action let-value let-row="row">
      <button (click)="doSomething(row); $event.stopPropagation()">Action</button>
    </ng-template>

<div >{{selectedcontents}}</div>
