<div class="datepicker">
  <label *ngIf="label">{{ label }}</label>
  <div class="input-wrapper" #inputWrapper (click)="toggleCalendar()">
    <input
      readonly
      [value]="value ? (value | date: 'dd-MM-yyyy') : ''"
      class="input-box"
    />
    <div class="calendar-icon">📅</div>
  </div>

  <div 
    class="calendar" 
    #calendar
    *ngIf="isOpen"
    [class.show-above]="showAbove"
  >
    <div class="calendar-header">
      <button (click)="prevMonth()">◀</button>
      <span>{{ getMonthName() }}</span>
      <button (click)="nextMonth()">▶</button>
    </div>

    <table class="calendar-grid">
      <thead>
        <tr>
          <th *ngFor="let dayName of getWeekdayNames()">{{ dayName }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let week of weeks">
          <td *ngFor="let day of week">
            <button
              *ngIf="day"
              [class.today]="value && isSameDate(day, value)"
              (click)="selectDate(day)"
            >
              {{ day.getDate() }}
            </button>
            <span *ngIf="!day"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
