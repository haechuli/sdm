<div class="datepicker">
  <label *ngIf="label">{{ label | translate }}</label>
  <div class="input-wrapper" #inputWrapper (click)="toggleCalendar()">
    <input
      readonly
      [value]="value ? (value | date: dateFormat) : ''"
      class="input-box"
      [placeholder]="placeholder"
    />
    <div class="calendar-icon">📅</div>
  </div>

  <div
    class="calendar"
    #calendar
    *ngIf="isOpen"
    [class.show-above]="showAbove"
  >
    <div class="calendar-header">
      <button (click)="prevMonth()" type="button" class="nav-button">◀</button>
      <span class="month-year">{{ getMonthName() }}</span>
      <button (click)="nextMonth()" type="button" class="nav-button">▶</button>
    </div>

    <table class="calendar-grid">
      <thead>
        <tr>
          <th *ngFor="let dayName of getWeekdayNames()">{{ dayName }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let week of weeks">
          <td *ngFor="let day of week">
            <button
              *ngIf="day"
              [class.today]="value && day && isSameDate(day, value)"
              [class.selected]="value && day && isSameDate(day, value)"
              (click)="selectDate(day)"
              type="button"
            >
              {{ day.getDate() }}
            </button>
            <span *ngIf="!day"></span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
