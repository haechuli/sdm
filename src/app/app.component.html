<!-- 로그인 페이지인 경우 -->
<div *ngIf="isLoginPage">
  <router-outlet></router-outlet>
</div>

<!-- 로그인된 상태에서 일반 페이지인 경우 -->
<div *ngIf="!isLoginPage && isAuthenticated">
  <app-layout></app-layout>
</div>

<!-- 로그인되지 않았지만 로그인 페이지가 아닌 경우 (리다이렉트 처리) -->
<div *ngIf="!isLoginPage && !isAuthenticated">
  <!-- 이 경우는 AuthGuard가 자동으로 /login으로 리다이렉트 시킴 -->
</div>

<!-- 전역 로딩 컴포넌트 -->
<app-global-loading></app-global-loading>
