<nav class="sidenav">
  <div class="sidenav-header">
    <h1>MY APP</h1>
    <button (click)="toggleSidenav()">Toggle Menu</button>
  </div>
  <ul style="margin-top: 10px;">
    <li *ngFor="let item of menu">
      <div class="menu-item" (click)="toggleTopLevel(item)">
        <fa-icon [icon]="item.icon!" class="menu-icon"></fa-icon>
        <span class="menu-text">{{ item.label | translate}}</span>
        <span *ngIf="item.children" class="expand-arrow" [class.expanded]="item.expanded">▾</span>
      </div>

      <ul class="sub-menu" [class.open]="item.expanded">
        <li *ngFor="let child of item.children">
          <div class="menu-item" (click)="toggleChild(child)">
            <fa-icon [icon]="child.icon!" class="menu-icon"></fa-icon>
            <span class="menu-text">{{ child.label | translate}}</span>
            <span *ngIf="child.children" class="expand-arrow" [class.expanded]="child.expanded">▾</span>
          </div>

          <ul class="sub-menu" [class.open]="child.expanded">
            <li *ngFor="let sub of child.children">
              <a
                [routerLink]="sub.route"
                [class.active]="isActive(sub.route)"
              >
                <fa-icon [icon]="sub.icon!" class="menu-icon"></fa-icon>
                <span class="menu-text">{{ sub.label | translate}}</span>
              </a>
            </li>
          </ul>
        </li>
      </ul>
    </li>
  </ul>
</nav>
