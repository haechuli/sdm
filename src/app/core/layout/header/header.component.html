<header class="header">
  <div class="left">{{ 'admin_system' | translate }}</div>
  <div class="right">
    <app-language-selector></app-language-selector>
    <app-theme-selector></app-theme-selector>
    <span class="user-info" *ngIf="currentUser">{{ currentUser.name }}</span>
    <app-button [label]="'run' | translate" (clicked)="run()"></app-button>
    <app-button [label]="'logout' | translate" color="secondary" (clicked)="logout()"></app-button>
  </div>
</header>
